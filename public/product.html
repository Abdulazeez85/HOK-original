<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Product Details — HOK Computers</title>
  <meta name="description" content="Detailed product page for HOK Computers. View specs, pricing and order options for each product."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body>
  <div id="navbar-mount"></div>

  <div class="page-hero">
    <div class="container">
      <p class="breadcrumb"><a href="/">Home</a> / <a href="/products">Products</a> / <span id="breadcrumbProduct">Product</span></p>
      <h1 id="pageTitle">Product Details</h1>
      <p class="page-hero-sub" id="pageSubtitle">See full specs, stock status and WhatsApp order options for this product.</p>
    </div>
  </div>

  <div class="product-detail-page">
    <div class="container detail-page-container">
      <div id="detailContent" class="detail-grid">
        <div class="detail-loading">Loading product…</div>
      </div>
    </div>
  </div>

  <div id="footer-mount"></div>
  <div id="modals-mount"></div>

  <script src="/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('navbar-mount').innerHTML = getNavHTML('products');
      document.getElementById('footer-mount').innerHTML = getFooterHTML();
      document.getElementById('modals-mount').innerHTML = getCartDrawerHTML() + getModalsHTML();
      await loadSettings();
      initCommon();
      updateCartUI();

      const match = window.location.pathname.match(/^\/product\/([^\/]+)$/);
      const productId = match ? match[1] : null;
      if (!productId) return renderNotFound();

      try {
        const res = await fetch('/api/products/' + productId);
        if (!res.ok) return renderNotFound();
        const product = await res.json();
        renderProductDetail(product);
      } catch (error) {
        renderNotFound();
      }
    });

    function renderNotFound() {
      const content = document.getElementById('detailContent');
      content.innerHTML = `
        <div class="detail-not-found">
          <h2>Product not found</h2>
          <p>We couldn't find the product you were looking for. Please return to the products page and try again.</p>
          <a class="btn-ghost" href="/products">Back to Products</a>
        </div>`;
    }

    function renderProductDetail(product) {
      const delivery = settings.delivery || {};
      const gallery = Array.isArray(product.images) && product.images.length ? product.images : product.image ? [product.image] : [];
      const mainImage = gallery[0] || '';
      const specsHtml = Object.entries(product.specs || {})
        .filter(([, value]) => value && value !== 'N/A')
        .map(([key, value]) => `
          <div class="detail-spec-row">
            <span>${key.charAt(0).toUpperCase() + key.slice(1)}</span>
            <strong>${value}</strong>
          </div>`)
        .join('');

      const galleryThumbs = gallery.length > 1 ? gallery.map((src, idx) => `
          <button class="detail-thumb${idx === 0 ? ' active' : ''}" onclick="swapDetailImage('${src}', this)">
            <img src="${src}" alt="${product.name} image ${idx + 1}" loading="lazy"/>
          </button>`).join('') : '';

      const badge = product.badge ? `<span class="detail-badge ${badgeClass(product.badge)}">${badgeLabel(product.badge)}</span>` : '';
      const displayImage = mainImage || '';

      const content = document.getElementById('detailContent');
      content.innerHTML = `
        <div class="detail-image-card">
          <div class="detail-image"><img id="detailMainImage" src="${displayImage}" alt="${product.name}" loading="lazy"/></div>
          <div class="detail-image-meta">
            <span class="p-stock ${stockClass(product.stock)}">${product.stock}</span>
            <span class="detail-warranty">✅ ${product.warranty || '6 Months'} Warranty</span>
          </div>
          ${galleryThumbs ? `<div class="detail-gallery">${galleryThumbs}</div>` : ''}
        </div>
        <div class="detail-info">
          <div class="detail-meta">
            <span class="detail-brand">${product.brand}</span>
            ${badge}
          </div>
          <h2 class="detail-name">${product.name}</h2>
          <div class="detail-price">${fmt(product.price)}</div>
          <div class="detail-summary">
            <p>${product.specs?.condition ? product.specs.condition + ' • ' : ''}${product.specs?.ram || ''}${product.specs?.ram && product.specs?.storage ? ' • ' : ''}${product.specs?.storage || ''}</p>
          </div>
          <div class="detail-actions">
            <button class="btn-primary" onclick="addToCart('${product.id}','${product.name}',${product.price},'${displayImage}')">Add to Cart</button>
            <button class="btn-primary" onclick="payWithPaystack('${product.id}','${product.name}',${product.price})">Pay with Card</button>
            <button class="btn-wa full" onclick="buyNowWA('${product.id}','${product.name}',${product.price})">Buy via WhatsApp</button>
          </div>
          <div class="detail-box">
            <div class="detail-box-title">Delivery</div>
            <p>${delivery.local || 'Ilorin — Same Day'} · ${delivery.state || 'Other Kwara — Next Day'} · ${delivery.national || 'Outside Kwara — 2-3 Days'}</p>
          </div>
          <div class="detail-box detail-specs-card">
            <div class="detail-box-title">Specifications</div>
            ${specsHtml || '<p>No additional specifications available.</p>'}
          </div>
          <div class="detail-backlink"><a href="/products" class="btn-ghost">← Back to Products</a></div>
        </div>`;
    }

    function swapDetailImage(src, btn) {
      const img = document.getElementById('detailMainImage');
      if (!img) return;
      img.src = src;
      document.querySelectorAll('.detail-thumb').forEach(el => el.classList.remove('active'));
      if (btn) btn.classList.add('active');
    }
  </script>
</body>
</html>
