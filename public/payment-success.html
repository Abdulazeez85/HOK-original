<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Payment Status — HOK Computers</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body>
  <div class="page-hero">
    <div class="container">
      <h1>Payment Status</h1>
      <p class="page-hero-sub">Verifying your payment with Paystack.</p>
    </div>
  </div>
  <div class="container" style="padding:40px 0;">
    <div class="detail-box" id="statusBox" style="max-width:720px;margin:0 auto;">
      <p>Checking payment status...</p>
    </div>
  </div>
  <div id="footer-mount"></div>
  <script src="/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
  document.getElementById('footer-mount').innerHTML = getFooterHTML();
  await loadSettings();
  initCommon();

  const params = new URLSearchParams(window.location.search);
  const reference = params.get('reference');
  const box = document.getElementById('statusBox');

  if (!reference) {
    box.innerHTML = '<h2>Missing payment reference.</h2><p>Please try again or contact support.</p><a class="btn-primary" href="/products">Back to products</a>';
    return;
  }

  try {
    const res = await fetch(`/api/paystack/verify/${encodeURIComponent(reference)}`);
    const data = await res.json();

    if (!res.ok) {
      box.innerHTML = `<h2>Payment verification failed</h2><p>${data.error || 'Unable to verify.'}</p><a class="btn-primary" href="/products">Back to products</a>`;
      return;
    }

    const meta = data.metadata || {};

    box.innerHTML = `
      <div style="text-align:center;padding:20px 0">
        <div style="font-size:3rem;margin-bottom:16px">✅</div>
        <h2 style="font-size:1.4rem;font-weight:600;color:var(--text-1);margin-bottom:8px">Payment Successful!</h2>
        <p style="color:var(--text-2);font-size:0.88rem;margin-bottom:24px">A receipt has been sent to your email address.</p>
      </div>
      <div style="background:var(--bg-2);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px">
        <div class="modal-spec-row" style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:0.85rem"><span style="color:var(--text-2)">Product</span><span style="font-weight:600">${meta.productName || 'N/A'}</span></div>
        <div class="modal-spec-row" style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:0.85rem"><span style="color:var(--text-2)">Amount Paid</span><span style="font-weight:600;color:var(--accent)">₦${(data.amount / 100).toLocaleString('en-NG')}</span></div>
        <div class="modal-spec-row" style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:0.85rem"><span style="color:var(--text-2)">Name</span><span style="font-weight:600">${meta.customerName || 'N/A'}</span></div>
        <div class="modal-spec-row" style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:0.85rem"><span style="color:var(--text-2)">Phone</span><span style="font-weight:600">${meta.customerPhone || 'N/A'}</span></div>
        <div class="modal-spec-row" style="display:flex;justify-content:space-between;padding:8px 0;font-size:0.85rem"><span style="color:var(--text-2)">Reference</span><span style="font-weight:600">${data.reference}</span></div>
      </div>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <a href="/products" class="btn-primary" style="flex:1;justify-content:center">Continue Shopping</a>
      </div>`;

    // Show WhatsApp popup
if (data.whatsappUrl) {
  const popup = document.createElement('div');
  popup.style.cssText = `
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--card-bg);border:1px solid rgba(37,212,102,0.4);
    border-radius:16px;padding:20px 24px;z-index:9999;
    box-shadow:0 20px 60px rgba(0,0,0,0.4);
    max-width:360px;width:90%;text-align:center;
    animation:fadeUp 0.4s ease;
  `;
  popup.innerHTML = `
    <div style="font-size:1.8rem;margin-bottom:8px">📦</div>
    <h4 style="color:var(--text-1);font-size:0.95rem;font-weight:600;margin-bottom:6px">
      Confirm Your Delivery
    </h4>
    <p style="color:var(--text-2);font-size:0.82rem;line-height:1.5;margin-bottom:16px;font-weight:300">
      Send your order details to HOK Computers on WhatsApp so they can arrange your delivery.
    </p>
    <a href="${data.whatsappUrl}" target="_blank"
      style="display:flex;align-items:center;justify-content:center;gap:8px;
      background:#128c7e;color:#fff;padding:12px 20px;border-radius:10px;
      font-size:0.88rem;font-weight:600;text-decoration:none;margin-bottom:10px"
      onclick="this.closest('div[style]').remove()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
        <path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.122 1.532 5.852L.054 23.447a.5.5 0 00.61.61l5.595-1.478A11.945 11.945 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.802 9.802 0 01-5.031-1.385l-.36-.214-3.733.985.997-3.617-.235-.372A9.808 9.808 0 012.182 12C2.182 6.57 6.57 2.182 12 2.182S21.818 6.57 21.818 12 17.43 21.818 12 21.818z"/>
      </svg>
      Send Order to HOK WhatsApp
    </a>
    <button onclick="this.closest('div[style]').remove()"
      style="background:none;border:none;color:var(--text-3);font-size:0.78rem;
      cursor:pointer;padding:4px">
      I'll do this later
    </button>
  `;
  document.body.appendChild(popup);
}

  } catch (err) {
    box.innerHTML = `<h2>Verification error</h2><p>Could not verify payment. Please contact support.</p><a class="btn-primary" href="/products">Back to products</a>`;
    console.error(err);
  }
});
  </script>
</body>
</html>
