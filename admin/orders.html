<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Orders — HOK Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/admin/admin.css"/>
</head>
<body>
<div class="admin-layout">
  <div id="sidebar-mount"></div>
  <main class="admin-main">
    <div class="admin-topbar">
      <div><h1 class="page-title">Orders</h1><p class="page-sub">Track Paystack orders and cart payments.</p></div>
    </div>

    <div class="card">
      <div class="table-wrap">
        <table>
<thead>
  <tr>
    <th>Reference</th>
    <th>Product</th>
    <th>Customer Name</th>
    <th>Phone</th>
    <th>Address</th>
    <th>Amount</th>
    <th>Status</th>
    <th>Date</th>
  </tr>
</thead>          <tbody id="ordersTable"></tbody>
        </table>
      </div>
      <div class="empty-state" id="emptyOrders" style="display:none"><span>🧾</span><p>No orders yet.</p></div>
    </div>
  </main>
</div>
<script src="/admin/admin.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const ok = await checkAuth(); if (!ok) return;
  document.getElementById('sidebar-mount').innerHTML = getSidebarHTML('orders');
  const res = await adminFetch('/api/admin/orders');
  const orders = await res.json();
  const tbody = document.getElementById('ordersTable');
  const empty = document.getElementById('emptyOrders');
  if (!orders.length) { empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  tbody.innerHTML = orders.map(o => `
  <tr>
    <td style="font-size:0.75rem;color:var(--text-3)">${o.reference}</td>
    <td class="td-name">${o.productName || o.metadata?.productName || 'N/A'}</td>
    <td>${o.customerName || o.metadata?.customerName || 'N/A'}</td>
    <td>${o.customerPhone || o.metadata?.customerPhone || 'N/A'}</td>
    <td style="max-width:150px;font-size:0.78rem">${o.customerAddress || o.metadata?.customerAddress || 'N/A'}</td>
    <td class="td-price">${fmt(o.amount)}</td>
    <td><span class="badge ${o.status === 'success' ? 'badge-green' : 'badge-yellow'}">${o.status}</span></td>
    <td style="font-size:0.75rem">${o.paidAt ? new Date(o.paidAt).toLocaleDateString('en-NG') : 'Pending'}</td>
  </tr>`).join('');
});
</script>
</body>
</html>
